nc: 1
scales:
  #   [depth, width, max_channels]
  n: [0.50, 0.40, 512]   # 轻量，8–12GB 显存，首选快速迭代
  s: [0.60, 0.60, 512]   # 推荐默认（权衡好），12–16GB
  m: [0.75, 0.75, 512]   # 追求更高精度，>=16GB
  l: [1.00, 0.90, 512]   # 进一步堆深度，但仍限 512；>=24GB 且训练时间更长
  x: [1.00, 1.10, 512]   # 谨慎使用；224 下收益边际小，显存/算力开销增大



# ===== Backbone (TAD balanced) =====
backbone:
  - [-1, 1, Conv,  [64, 3, 2]]                 # 0 P1/2
  - [-1, 1, Conv,  [128, 3, 2]]                # 1 P2/4
  - [-1, 3, C2f,   [128, True]]                # 2 局部细节
  - [-1, 1, Conv,  [256, 3, 2]]                # 3 P3/8
  - [-1, 4, C3k2,  [256, True, 0.5]]           # 4 中尺度大核
  - [-1, 1, Conv,  [512, 3, 2]]                # 5 P4/16
  - [-1, 4, C3k2,  [512, True, 0.5]]           # 6 中尺度继续大核
  - [-1, 1, Conv,  [1024, 3, 2]]               # 7 P5/32 (224→7×7)
  - [-1, 2, A2C2f, [1024, True, 1, False]]            # 8 顶层少量注意力（area=1 安全）
  - [-1, 1, SPPF,  [1024, 5]]                  # 9 低成本全局上下文

# ===== Head for TAD (balanced) =====
head:
  # 顶层再精炼
  - [-1, 1, A2C2f, [1024, True, 1, False]]            # 10 P5/32 再次注意力（area=1）

  # 自顶向下 FPN
  - [-1, 1, Conv,        [512, 1, 1]]          # 11
  - [-1, 1, nn.Upsample, [None, 2]]            # 12  P5->P4
  - [[-1, 6], 1, Concat, [1]]                  # 13 与 P4(6) 拼
  - [-1, 2, C3k2,       [512, True, 0.5]]      # 14
  - [-1, 1, Conv,        [256, 1, 1]]          # 15
  - [-1, 1, nn.Upsample, [None, 2]]            # 16  P4->P3
  - [[-1, 4], 1, Concat, [1]]                  # 17 与 P3(4) 拼
  - [-1, 3, C2f,        [256, True]]           # 18  P3 输出

  # 自底向上 PAN
  - [-1, 1, Conv,        [256, 3, 2]]          # 19  P3->P4
  - [[-1, 14], 1, Concat,[1]]                  # 20  拼接 FPN 中间(14)
  - [-1, 2, C3k2,       [512, True, 0.5]]      # 21  P4 输出
  - [-1, 1, Conv,        [512, 3, 2]]          # 22  P4->P5
  - [[-1, 10], 1, Concat,[1]]                  # 23  拼接顶层(10)
  - [-1, 2, A2C2f,      [1024, True, 1, False]]       # 24  P5 输出（area=1）

  # 检测
  - [[18, 21, 24], 1, Detect, [nc]]
