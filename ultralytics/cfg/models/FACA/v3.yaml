nc: 1
names: [tad]

scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2f, [128, True]]

  - [-1, 1, Conv, [256, 3, 2]]          # P3/8
  - [-1, 6, C2f, [256, True]]

  - [-1, 1, Conv, [512, 3, 2]]          # P4/16
  - [-1, 3, C2f, [512, True]]
  - [-1, 1, FACA, [512, 8, 4, 3, True]]     # heads=8, reduction=4 → 128/8=16

  - [-1, 1, Conv, [1024, 3, 2]]         # P5/32
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 1, FACA, [1024, 16, 4, 3, True]]   # heads=16, reduction=4 → 256/16=16

head:
  - [-1, 1, Conv, [512, 1, 1]]
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 3, C2f, [512, False]]
  - [-1, 1, FACA, [512, 8, 4, 3, True]]      # 这里也用 8 头，保证可整除

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 3, C2f, [1024, False]]

  - [[16, 19], 1, Detect, [nc]]
